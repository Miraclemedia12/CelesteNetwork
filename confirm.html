<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocol Active | Celeste Network</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --neon: #00ff55; --bg: #000000; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .success-card { background: #080808; border: 1px solid rgba(255,255,255,0.05); border-radius: 40px; padding: 40px; text-align: center; width: 90%; max-width: 380px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .glow-circle { width: 80px; height: 80px; background: rgba(0, 255, 85, 0.05); border: 2px solid var(--neon); border-radius: 50%; margin: 0 auto 30px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(0, 255, 85, 0.2); }
        .neon-text { color: var(--neon); text-shadow: 0 0 10px rgba(0, 255, 85, 0.3); }
    </style>
</head>
<body>

    <div class="success-card">
        <div class="glow-circle">
            <i class="fas fa-check-double text-3xl" style="color: #00ff55;"></i>
        </div>
        
        <h1 class="text-[10px] font-black uppercase tracking-[0.5em] text-gray-500 mb-4">User Verified</h1>
        <h2 class="text-2xl font-black italic tracking-tighter mb-4 uppercase">Email <span class="neon-text">Confirmed</span></h2>
        
        <p class="text-gray-400 text-[11px] leading-relaxed mb-10 px-4 uppercase font-bold tracking-[0.1em]">
            You Can now Login to your dashboard. with your email and password.
        </p>

        <a href="index.html" class="block w-full bg-[#00ff55] text-black font-black py-5 rounded-2xl uppercase tracking-[0.2em] text-[11px] active:scale-95 transition-all shadow-[0_10px_30px_rgba(0,255,85,0.15)]">
            Go to Login
        </a>
    </div>

</body>
</html>
