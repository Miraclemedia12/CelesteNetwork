<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CELESTE - Reset Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: radial-gradient(circle at top right, #003311 0%, #001a09 40%, #000000 100%);
            display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: white;
        }

        .auth-container { 
            background: rgba(0, 0, 0, 0.6); padding: 40px 30px; border-radius: 24px; 
            box-shadow: 0 20px 50px rgba(0, 255, 85, 0.1); width: 100%; max-width: 380px; 
            text-align: center; border: 1px solid rgba(0, 255, 85, 0.15); backdrop-filter: blur(15px);
        }

        h2 { color: #00ff55; font-size: 28px; font-weight: 800; margin-bottom: 10px; text-transform: uppercase; }
        p { color: #88aa99; margin-bottom: 25px; font-size: 14px; }
        
        .input-group { margin-bottom: 20px; text-align: left; position: relative; }
        label { display: block; margin-bottom: 8px; font-size: 12px; color: #00ff55; font-weight: 700; text-transform: uppercase; }
        
        input { 
            width: 100%; padding: 16px; border: 1px solid rgba(0, 255, 85, 0.2); border-radius: 14px; 
            background: rgba(0, 40, 20, 0.4); color: white; font-size: 16px; box-sizing: border-box; outline: none;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 42px;
            color: #00ff55;
            cursor: pointer;
            opacity: 0.7;
        }

        button { 
            width: 100%; padding: 18px; border: none; border-radius: 14px; cursor: pointer; 
            font-weight: 800; font-size: 16px; background: #00ff55; color: #000; text-transform: uppercase;
            transition: 0.3s;
        }

        button:disabled { background: #444; color: #888; cursor: not-allowed; }
        
        #message { margin-top: 20px; font-size: 14px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2>New Password</h2>
        <p>Set a secure password for your CELESTE account.</p>
        
        <div class="input-group">
            <label>New Password</label>
            <input type="password" id="newPassword" placeholder="••••••••">
            <i class="fas fa-eye toggle-password" id="toggleEye" onclick="togglePasswordVisibility()"></i>
        </div>
        
        <button id="updateBtn" onclick="updatePassword()">Update Password</button>
        <div id="message"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Project Credentials
        const SUPABASE_URL = 'https://gbmpenlojubfkvqeyxkh.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_rYaNpJ5Ngw35pxv4TFmXQw_6-LrYGo-';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Capture session from URL immediately
        window.onload = async () => {
            const messageDiv = document.getElementById('message');
            const { data, error } = await supabaseClient.auth.getSession();
            
            if (error || !data.session) {
                messageDiv.style.color = "#ff4444";
                messageDiv.innerText = "Auth session missing! Please request a new link from the login page.";
                document.getElementById('updateBtn').disabled = true;
            } else {
                messageDiv.style.color = "#00ff55";
                messageDiv.innerText = "Secure session active. Enter new password.";
            }
        };

        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('newPassword');
            const eyeIcon = document.getElementById('toggleEye');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        async function updatePassword() {
            const newPassword = document.getElementById('newPassword').value;
            const messageDiv = document.getElementById('message');
            const btn = document.getElementById('updateBtn');

            if (newPassword.length < 6) {
                messageDiv.style.color = "#ff4444";
                messageDiv.innerText = "Minimum 6 characters required.";
                return;
            }

            btn.innerText = "UPDATING...";
            btn.disabled = true;

            const { error } = await supabaseClient.auth.updateUser({
                password: newPassword
            });

            if (error) {
                messageDiv.style.color = "#ff4444";
                messageDiv.innerText = error.message;
                btn.innerText = "UPDATE PASSWORD";
                btn.disabled = false;
            } else {
                messageDiv.style.color = "#00ff55";
                messageDiv.innerText = "Success! Redirecting...";
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
            }
        }
    </script>
</body>
</html>
