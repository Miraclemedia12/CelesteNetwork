<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CELESTE - Reset Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: radial-gradient(circle at top right, #003311 0%, #001a09 40%, #000000 100%); 
            display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; color: white; 
        }

        .auth-container { 
            background: rgba(0, 0, 0, 0.6); padding: 40px 30px; border-radius: 24px; 
            box-shadow: 0 20px 50px rgba(0, 255, 85, 0.1); width: 100%; max-width: 380px; 
            text-align: center; border: 1px solid rgba(0, 255, 85, 0.15); backdrop-filter: blur(15px); 
        }

        h2 { color: #00ff55; font-size: 28px; font-weight: 800; margin-bottom: 10px; text-transform: uppercase; }
        p { color: #88aa99; margin-bottom: 25px; font-size: 14px; }
        
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-size: 12px; color: #00ff55; font-weight: 700; text-transform: uppercase; }
        
        input { 
            width: 100%; padding: 16px; border: 1px solid rgba(0, 255, 85, 0.2); border-radius: 14px; 
            background: rgba(0, 40, 20, 0.4); color: white; font-size: 16px; box-sizing: border-box; outline: none; 
        }

        button { 
            width: 100%; padding: 18px; border: none; border-radius: 14px; cursor: pointer; 
            font-weight: 800; font-size: 16px; background: #00ff55; color: #000; text-transform: uppercase; 
            transition: 0.3s;
        }

        button:hover { background: #00cc44; transform: translateY(-2px); }

        /* ELITE SUCCESS POPUP */
        #successPopup {
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); 
            backdrop-filter: blur(15px);
            justify-content: center; 
            align-items: center; 
            z-index: 1000;
        }

        .popup-content {
            background: #001a09; 
            padding: 50px 40px; 
            border-radius: 30px; 
            border: 1px solid #00ff55;
            text-align: center; 
            box-shadow: 0 0 50px rgba(0, 255, 85, 0.3);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .popup-content i { color: #00ff55; font-size: 70px; margin-bottom: 20px; }
        .popup-content h3 { color: #00ff55; font-size: 24px; margin: 10px 0; text-transform: uppercase; }
        .popup-content p { color: #88aa99; font-size: 16px; }

        #message { margin-top: 20px; font-size: 14px; font-weight: 600; }
    </style>
</head>
<body>

    <div id="successPopup">
        <div class="popup-content">
            <i class="fas fa-check-double"></i>
            <h3>Password Updated</h3>
            <p>Your security is now active.<br>Redirecting to login...</p>
        </div>
    </div>

    <div class="auth-container">
        <h2>Reset Access</h2>
        <p>Enter the 6-digit code to proceed.</p>
        
        <div class="input-group">
            <label>Confirm Email</label>
            <input type="email" id="resetEmail" readonly style="opacity: 0.7;">
        </div>

        <div class="input-group">
            <label>6-Digit Code</label>
            <input type="text" id="otpToken" placeholder="000000" maxlength="6">
        </div>

        <div class="input-group">
            <label>New Password</label>
            <input type="password" id="newPassword" placeholder="••••••••">
        </div>
        
        <button id="updateBtn" onclick="verifyAndReset()">Update Password</button>
        <div id="message"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://hwensxsqikohnsxwdxji.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_S3ryEPuq04Bw8yJ3_LzmxA_qyVKpJPf';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Autofill email from URL
        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            if (params.get('email')) { 
                document.getElementById('resetEmail').value = params.get('email'); 
            }
        };

        async function verifyAndReset() {
            const email = document.getElementById('resetEmail').value;
            const token = document.getElementById('otpToken').value.trim();
            const newPassword = document.getElementById('newPassword').value;
            const messageDiv = document.getElementById('message');
            const btn = document.getElementById('updateBtn');

            if (token.length !== 6 || newPassword.length < 6) {
                messageDiv.style.color = "#ff4444";
                messageDiv.innerText = "Check your code and password length.";
                return;
            }

            btn.disabled = true;
            btn.innerText = "AUTHORIZING...";

            // Step 1: Verify the 6-digit OTP
            const { error: verifyError } = await supabaseClient.auth.verifyOtp({
                email: email,
                token: token,
                type: 'recovery'
            });

            if (verifyError) {
                messageDiv.style.color = "#ff4444";
                messageDiv.innerText = "Invalid Code: " + verifyError.message;
                btn.disabled = false;
                btn.innerText = "UPDATE PASSWORD";
                return;
            }

            // Step 2: Update the user password
            const { error: updateError } = await supabaseClient.auth.updateUser({
                password: newPassword
            });

            if (updateError) {
                messageDiv.style.color = "#ff4444";
                messageDiv.innerText = updateError.message;
                btn.disabled = false;
            } else {
                // SHOW CUSTOM POPUP & REDIRECT
                document.getElementById('successPopup').style.display = 'flex';
                setTimeout(() => {
                    window.location.href = 'index.html'; 
                }, 3000); // 3 seconds to enjoy the success screen
            }
        }
    </script>
</body>
</html>
