<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CELESTE - Reset</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at top right, #003311 0%, #001a09 40%, #000000 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; color: white; }
        .auth-container { background: rgba(0, 0, 0, 0.6); padding: 40px 30px; border-radius: 24px; box-shadow: 0 20px 50px rgba(0, 255, 85, 0.1); width: 100%; max-width: 380px; text-align: center; border: 1px solid rgba(0, 255, 85, 0.15); backdrop-filter: blur(15px); }
        h2 { color: #00ff55; font-size: 28px; font-weight: 800; margin-bottom: 10px; text-transform: uppercase; }
        p { color: #88aa99; margin-bottom: 25px; font-size: 14px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-size: 12px; color: #00ff55; font-weight: 700; text-transform: uppercase; }
        input { width: 100%; padding: 16px; border: 1px solid rgba(0, 255, 85, 0.2); border-radius: 14px; background: rgba(0, 40, 20, 0.4); color: white; font-size: 16px; box-sizing: border-box; outline: none; }
        button { width: 100%; padding: 18px; border: none; border-radius: 14px; cursor: pointer; font-weight: 800; font-size: 16px; background: #00ff55; color: #000; text-transform: uppercase; }
        #message { margin-top: 20px; font-size: 14px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2>Verify Identity</h2>
        <p>Enter your details and the 6-digit code.</p>
        <div class="input-group"><label>Email</label><input type="email" id="resetEmail"></div>
        <div class="input-group"><label>6-Digit Code</label><input type="text" id="otpToken" maxlength="6"></div>
        <div class="input-group"><label>New Password</label><input type="password" id="newPassword"></div>
        <button onclick="verifyAndReset()">Update Password</button>
        <div id="message"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Matching the credentials exactly
        const SUPABASE_URL = 'https://hwensxsqikohnsxwdxji.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_S3ryEPuq04Bw8yJ3_LzmxA_qyVKpJPf';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Autofill email from URL
        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            if (params.get('email')) { document.getElementById('resetEmail').value = params.get('email'); }
        };

        async function verifyAndReset() {
            const email = document.getElementById('resetEmail').value;
            const token = document.getElementById('otpToken').value;
            const newPassword = document.getElementById('newPassword').value;

            // Step 1: Verify Code
            const { error: vError } = await supabaseClient.auth.verifyOtp({ email, token, type: 'recovery' });
            if (vError) { document.getElementById('message').innerText = vError.message; return; }

            // Step 2: Update Password
            const { error: uError } = await supabaseClient.auth.updateUser({ password: newPassword });
            if (uError) { document.getElementById('message').innerText = uError.message; }
            else { alert("Success!"); window.location.href = 'index.html'; }
        }
    </script>
</body>
</html>
