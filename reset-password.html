<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CELESTE - Reset Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: radial-gradient(circle at top right, #003311 0%, #001a09 40%, #000000 100%);
            display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; color: white;
        }

        .auth-container { 
            background: rgba(0, 0, 0, 0.6); padding: 40px 30px; border-radius: 24px; 
            box-shadow: 0 20px 50px rgba(0, 255, 85, 0.1); width: 100%; max-width: 380px; 
            text-align: center; border: 1px solid rgba(0, 255, 85, 0.15); backdrop-filter: blur(15px);
        }

        h2 { color: #00ff55; font-size: 28px; font-weight: 800; margin-bottom: 10px; text-transform: uppercase; }
        p { color: #88aa99; margin-bottom: 25px; font-size: 14px; }
        
        .input-group { margin-bottom: 20px; text-align: left; position: relative; }
        label { display: block; margin-bottom: 8px; font-size: 12px; color: #00ff55; font-weight: 700; text-transform: uppercase; }
        
        input { 
            width: 100%; padding: 16px; border: 1px solid rgba(0, 255, 85, 0.2); border-radius: 14px; 
            background: rgba(0, 40, 20, 0.4); color: white; font-size: 16px; box-sizing: border-box; outline: none;
        }

        .toggle-password {
            position: absolute; right: 15px; top: 42px; color: #00ff55; cursor: pointer; opacity: 0.7;
        }

        button { 
            width: 100%; padding: 18px; border: none; border-radius: 14px; cursor: pointer; 
            font-weight: 800; font-size: 16px; background: #00ff55; color: #000; text-transform: uppercase;
        }
        
        #message { margin-top: 20px; font-size: 14px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2>Verify Identity</h2>
        <p>Enter your email and the 6-digit code sent to you.</p>
        
        <div class="input-group">
            <label>Your Email</label>
            <input type="email" id="resetEmail" placeholder="your@email.com">
        </div>

        <div class="input-group">
            <label>6-Digit Reset Code</label>
            <input type="text" id="otpToken" placeholder="123456" maxlength="6">
        </div>

        <div class="input-group">
            <label>New Password</label>
            <input type="password" id="newPassword" placeholder="••••••••">
            <i class="fas fa-eye toggle-password" id="toggleEye" onclick="togglePasswordVisibility()"></i>
        </div>
        
        <button id="updateBtn" onclick="verifyAndReset()">Update Password</button>
        <div id="message"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://gbmpenlojubfkvqeyxkh.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_rYaNpJ5Ngw35pxv4TFmXQw_6-LrYGo-';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('newPassword');
            const eyeIcon = document.getElementById('toggleEye');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        async function verifyAndReset() {
            const email = document.getElementById('resetEmail').value.trim();
            const token = document.getElementById('otpToken').value.trim();
            const newPassword = document.getElementById('newPassword').value;
            const messageDiv = document.getElementById('message');
            const btn = document.getElementById('updateBtn');

            if (!email || !token || newPassword.length < 6) {
                messageDiv.style.color = "#ff4444";
                messageDiv.innerText = "Please fill in all fields correctly.";
                return;
            }

            btn.innerText = "VERIFYING...";
            btn.disabled = true;

            // STEP 1: Use the 6-digit code to verify the user
            const { error: verifyError } = await supabaseClient.auth.verifyOtp({
                email: email,
                token: token,
                type: 'recovery'
            });

            if (verifyError) {
                messageDiv.style.color = "#ff4444";
                messageDiv.innerText = "Invalid Code: " + verifyError.message;
                btn.innerText = "UPDATE PASSWORD";
                btn.disabled = false;
                return;
            }

            // STEP 2: Update the password now that the code worked
            const { error: updateError } = await supabaseClient.auth.updateUser({
                password: newPassword
            });

            if (updateError) {
                messageDiv.style.color = "#ff4444";
                messageDiv.innerText = updateError.message;
                btn.innerText = "UPDATE PASSWORD";
                btn.disabled = false;
            } else {
                messageDiv.style.color = "#00ff55";
                messageDiv.innerText = "Success! Redirecting...";
                setTimeout(() => { window.location.href = 'index.html'; }, 2000);
            }
        }
    </script>
</body>
</html>
