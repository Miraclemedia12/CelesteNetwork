<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Celeste Network</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #000; color: #fff; padding: 20px; }
        .pay-card { background: #0a0a0a; border: 1px solid rgba(0, 255, 85, 0.2); border-radius: 28px; padding: 30px; max-width: 360px; margin: 40px auto; text-align: center; }
        .price-tag { font-size: 32px; font-weight: 900; color: #00ff55; margin: 15px 0; }
        .pay-btn { background: #00a2ff; color: white; width: 100%; padding: 18px; border-radius: 16px; font-weight: 800; text-transform: uppercase; cursor: pointer; transition: 0.3s; width: 100%; border: none; }
        .pay-btn:disabled { background: #333; cursor: not-allowed; opacity: 0.6; }
    </style>
</head>
<body>
    <div class="max-w-md mx-auto">
        <div class="flex items-center gap-4 mb-4">
            <a href="upgrade.html" class="text-gray-500"><i class="fas fa-arrow-left"></i></a>
            <h1 class="text-xl font-black uppercase italic tracking-tighter">Checkout</h1>
        </div>

        <div class="pay-card">
            <h2 class="text-lg font-bold text-gray-300">Starter Plan Upgrade</h2>
            <div class="price-tag">₦14,500</div>
            <p class="text-[12px] text-gray-500 mb-8 italic italic">Securely hosted by Paystack</p>
            
            <button type="button" id="payButton" onclick="payWithPaystack()" class="pay-btn">
                Confirm & Pay
            </button>

            <div class="mt-6 flex items-center justify-center gap-2 opacity-20 text-[10px] uppercase font-bold">
                <i class="fas fa-lock"></i> Secured by Paystack
            </div>
        </div>
    </div>

    <script src="https://js.paystack.co/v1/inline.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = 'https://hwensxsqikohnsxwdxji.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_S3ryEPuq04Bw8yJ3_LzmxA_qyVKpJPf';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function payWithPaystack() {
            const btn = document.getElementById('payButton');
            btn.disabled = true;
            btn.innerText = "Connecting...";

            // Get User Info
            supabaseClient.auth.getUser().then(({ data: { user }, error }) => {
                if (error || !user) {
                    alert("Please login again to continue.");
                    btn.disabled = false;
                    btn.innerText = "Confirm & Pay";
                    return;
                }

                // Standard Paystack Pop Setup
                const handler = PaystackPop.setup({
                    key: 'pk_live_ed525c84b668b33982b108f17c1e057e94cb52e3',
                    email: user.email,
                    amount: 1450000, // ₦14,500 in kobo
                    currency: "NGN",
                    ref: "CEL-" + Math.floor((Math.random() * 1000000000) + 1),
                    metadata: {
                        custom_fields: [{ display_name: "User ID", variable_name: "user_id", value: user.id }]
                    },
                    callback: function(response) {
                        btn.innerText = "Upgrading Account...";
                        
                        // Update Database
                        supabaseClient
                            .from('profiles')
                            .update({ plan: 'Starter' })
                            .eq('id', user.id)
                            .then(() => {
                                // Send to Telegram
                                const msg = "Hello Coach Miracle, I have paid ₦14,500 for the Starter Plan Upgrade.%0AEmail: " + user.email + "%0ARef: " + response.reference;
                                window.location.href = "https://t.me/CoachMiracle1?text=" + msg;
                            });
                    },
                    onClose: function() {
                        btn.disabled = false;
                        btn.innerText = "Confirm & Pay";
                    }
                });

                handler.openIframe();
            });
        }
    </script>
</body>
</html>
