<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Celeste Network</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #000; color: #fff; padding: 20px; }
        .pay-card { background: #0a0a0a; border: 1px solid rgba(0, 255, 85, 0.2); border-radius: 28px; padding: 30px; max-width: 360px; margin: 40px auto; text-align: center; }
        .price-tag { font-size: 32px; font-weight: 900; color: #00ff55; margin: 15px 0; }
        .pay-btn { background: #f5a623; color: white; width: 100%; padding: 18px; border-radius: 16px; font-weight: 800; text-transform: uppercase; cursor: pointer; transition: 0.3s; width: 100%; }
        .pay-btn:disabled { background: #333; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="max-w-md mx-auto">
        <div class="flex items-center gap-4 mb-4">
            <a href="upgrade.html" class="text-gray-500"><i class="fas fa-arrow-left"></i></a>
            <h1 class="text-xl font-black uppercase italic">Checkout</h1>
        </div>

        <div class="pay-card">
            <h2 class="text-lg font-bold text-gray-300">Starter Plan Upgrade</h2>
            <div class="price-tag">₦14,500</div>
            <p class="text-[12px] text-gray-500 mb-8 italic">Secure payment via Flutterwave.</p>
            
            <button type="button" id="payButton" onclick="makePayment()" class="pay-btn">
                Pay Now
            </button>

            <div class="mt-6 flex items-center justify-center gap-2 opacity-20 text-[10px] uppercase font-bold">
                <i class="fas fa-lock"></i> Secured by Flutterwave
            </div>
        </div>
    </div>

    <script src="https://checkout.flutterwave.com/v3.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = 'https://hwensxsqikohnsxwdxji.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_S3ryEPuq04Bw8yJ3_LzmxA_qyVKpJPf';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function makePayment() {
            const btn = document.getElementById('payButton');
            btn.disabled = true;
            btn.innerText = "Connecting...";

            try {
                const { data: { user }, error: authError } = await supabaseClient.auth.getUser();
                
                if (authError || !user) { 
                    alert("Please log in again to continue."); 
                    btn.disabled = false;
                    btn.innerText = "Pay Now";
                    return; 
                }

                FlutterwaveCheckout({
                    public_key: "FLWPUBK-43704d9975cf827a40723d9abbdd00d8-X",
                    tx_ref: "CEL-" + Date.now(),
                    amount: 14500,
                    currency: "NGN",
                    payment_options: "card, banktransfer, ussd",
                    customer: {
                        email: user.email,
                        name: "Celeste Network User",
                    },
                    customizations: {
                        title: "Celeste Network",
                        description: "Starter Plan Upgrade",
                    },
                    callback: async function (data) {
                        btn.innerText = "Updating Account...";
                        
                        // Update Supabase Database
                        const { error: dbError } = await supabaseClient
                            .from('profiles')
                            .update({ plan: 'Starter' })
                            .eq('id', user.id);

                        if (dbError) {
                            console.error("Database error:", dbError);
                        }
                        
                        // Telegram Redirect to @CoachMiracle1
                        const message = `Hello Coach Miracle, I have paid ₦14,500 for the Starter Plan.%0AEmail: ${user.email}%0ATransaction ID: ${data.transaction_id}`;
                        window.location.href = `https://t.me/CoachMiracle1?text=${message}`;
                    },
                    onclose: function() {
                        btn.disabled = false;
                        btn.innerText = "Pay Now";
                    },
                });
            } catch (err) {
                alert("Critical Error: " + err.message);
                btn.disabled = false;
                btn.innerText = "Pay Now";
            }
        }
    </script>
</body>
</html>
