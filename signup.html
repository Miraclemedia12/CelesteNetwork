<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CELESTE - Join the Elite</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at top right, #003311 0%, #001a09 40%, #000000 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; color: white; padding: 20px; }
        .auth-container { background: rgba(0, 0, 0, 0.6); padding: 40px 30px; border-radius: 24px; box-shadow: 0 20px 50px rgba(0, 255, 85, 0.1); width: 100%; max-width: 420px; border: 1px solid rgba(0, 255, 85, 0.15); backdrop-filter: blur(15px); }
        h2 { color: #00ff55; font-size: 32px; font-weight: 800; margin-bottom: 25px; text-align: center; text-transform: uppercase; }
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .full-width { grid-column: span 2; }
        .input-group { margin-bottom: 15px; text-align: left; position: relative; } 
        label { display: block; margin-bottom: 6px; font-size: 11px; color: #00ff55; font-weight: 700; text-transform: uppercase; }
        input { width: 100%; padding: 14px; border: 1px solid rgba(0, 255, 85, 0.2); border-radius: 12px; background: rgba(0, 40, 20, 0.4); color: white; font-size: 14px; box-sizing: border-box; outline: none; }
        
        .toggle-password { position: absolute; right: 15px; top: 38px; color: #00ff55; cursor: pointer; opacity: 0.7; }
        .toggle-password:hover { opacity: 1; }

        .btn-reg { width: 100%; padding: 18px; border: none; border-radius: 14px; cursor: pointer; font-weight: 800; background: #00ff55; color: #000; text-transform: uppercase; margin-top: 15px; transition: 0.3s; }
        .btn-reg:active { transform: scale(0.98); }
        
        #message { margin-top: 15px; font-size: 13px; text-align: center; font-weight: 600; }
        .footer-links { margin-top: 20px; text-align: center; font-size: 14px; color: #668877; }
        .footer-links a { color: #00ff55; text-decoration: none; font-weight: bold; }

        /* Professional Success Modal Styles */
        #successModal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            padding: 20px;
        }
        .modal-content {
            background: #080808;
            border: 1px solid #00ff5533;
            border-radius: 30px;
            padding: 40px;
            text-align: center;
            max-width: 350px;
            width: 100%;
            box-shadow: 0 0 50px rgba(0, 255, 85, 0.1);
        }
        .modal-icon { width: 70px; height: 70px; background: rgba(0, 255, 85, 0.1); border: 2px solid #00ff55; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; color: #00ff55; font-size: 30px; }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2>JOIN CELESTE</h2>
        <div class="input-grid">
            <div class="input-group full-width"><label>Full Name</label><input type="text" id="fullName" placeholder="Full Name"></div>
            <div class="input-group"><label>Username</label><input type="text" id="username" placeholder="Username"></div>
            <div class="input-group"><label>Phone</label><input type="tel" id="phone" placeholder="Phone Number"></div>
            <div class="input-group full-width"><label>Email Address</label><input type="email" id="email" placeholder="Email"></div>
            <div class="input-group full-width">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••">
                <i class="fas fa-eye toggle-password" id="toggleEye" onclick="togglePasswordVisibility()"></i>
            </div>
        </div>
        <button class="btn-reg" id="regBtn" onclick="handleSignUp()">REGISTER</button>
        <div id="message"></div>
        <div class="footer-links">Already a member? <a href="index.html">Sign In</a></div>
    </div>

    <div id="successModal">
        <div class="modal-content">
            <div class="modal-icon"><i class="fas fa-paper-plane"></i></div>
            <h3 style="color: #00ff55; font-weight: 800; margin-bottom: 10px; text-transform: uppercase;">Verify User</h3>
            <p style="color: #888; font-size: 13px; line-height: 1.6; margin-bottom: 25px;">
                Account registered successfully. We have sent a confirmation link to your email. <br><br>
                <strong>Confirm the link to activate your Account.</strong>
            </p>
            <button onclick="window.location.href='index.html'" class="btn-reg" style="margin-top: 0;">GO TO LOGIN</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://hwensxsqikohnsxwdxji.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_S3ryEPuq04Bw8yJ3_LzmxA_qyVKpJPf';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('toggleEye');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        async function handleSignUp() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const fullName = document.getElementById('fullName').value;
            const username = document.getElementById('username').value;
            const phone = document.getElementById('phone').value;
            const messageDiv = document.getElementById('message');
            const regBtn = document.getElementById('regBtn');

            if(!email || !password) {
                messageDiv.style.color = "#ff4444";
                messageDiv.innerText = "Email and Password are required.";
                return;
            }

            regBtn.innerText = "Processing Protocol...";
            regBtn.disabled = true;
            
            // Added options to redirect specifically to your confirm.html
            const { data, error } = await supabaseClient.auth.signUp({ 
                email, 
                password,
                options: {
                    emailRedirectTo: 'https://miraclemedia12.github.io/CelesteNetwork/confirm.html',
                    data: {
                        full_name: fullName,
                        username: username,
                        phone: phone
                    }
                }
            });

            if (error) {
                regBtn.innerText = "REGISTER";
                regBtn.disabled = false;
                messageDiv.style.color = "#ff4444";
                messageDiv.innerText = error.message;
            } else {
                // Show professional Success Modal
                document.getElementById('successModal').style.display = 'flex';
            }
        }
    </script>
</body>
</html>
