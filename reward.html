<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celeste Dashboard | Rewards</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --neon: #00ff55; --bg: #000000; --card: #0a0a0a; --text: #ffffff; --soft-text: #888888; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 15px; padding-bottom: 120px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .balance-box { background: linear-gradient(145deg, #001a08, #000000); padding: 25px; border-radius: 24px; border: 1px solid rgba(0, 255, 85, 0.2); position: relative; }
        .balance-box h1 { color: var(--neon); margin: 5px 0; font-size: 34px; font-weight: 800; }
        .switch-btn { background: rgba(0,255,85,0.1); border: 1px solid var(--neon); color: var(--neon); padding: 8px 15px; border-radius: 50px; font-size: 11px; cursor: pointer; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; }
        .task-row { display: flex; overflow-x: auto; gap: 20px; padding-bottom: 20px; scrollbar-width: none; }
        .task-item { text-align: center; flex: 0 0 auto; width: 85px; cursor: pointer; }
        .circle-wrap { width: 68px; height: 68px; border-radius: 50%; border: 1px solid var(--neon); display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; background: rgba(0,255,85,0.03); }
        .circle-wrap i { font-size: 24px; color: var(--neon); }
        .p-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .stat-card { background: #0f0f0f; border: 1px solid #222; padding: 15px; border-radius: 18px; text-align: center; }
        .tx-card { background: #0f0f0f; border: 1px solid #222; padding: 15px; border-radius: 20px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .tx-icon { width: 40px; height: 40px; border-radius: 10px; background: rgba(0,255,85,0.1); display: flex; align-items: center; justify-content: center; color: var(--neon); }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #050505; display: flex; justify-content: space-around; padding: 15px; border-top: 1px solid #1a1a1a; }
        .nav-link { color: #555; text-decoration: none; font-size: 11px; text-align: center; }
        .upgrade-pill { background: var(--neon); color: #000 !important; padding: 10px 18px; border-radius: 8px; font-weight: 800; }
    </style>
</head>
<body>

    <div class="header">
        <i class="fas fa-bars" style="color:var(--neon); font-size:24px;"></i>
        <div style="display:flex; align-items:center; gap:10px;">
            <span id="userName">Investor</span>
            <div id="userInit" style="width:35px; height:35px; background:var(--neon); color:#000; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800;">I</div>
        </div>
    </div>

    <div class="balance-box">
        <p style="font-size: 10px; color: var(--soft-text);">AVAILABLE BALANCE</p>
        <h1 id="balTxt">₦0.00</h1>
        <div class="switch-btn" onclick="toggleCur()"><span id="curLabel">NAIRA</span> <i class="fas fa-sync-alt"></i></div>
    </div>

    <div style="font-weight:700; margin: 25px 0 15px;">Earning Tasks</div>
    <div class="task-row">
        <div class="task-item" onclick="window.location.href='watch.html'"><div class="circle-wrap"><i class="fas fa-play"></i></div><span>Videos</span></div>
        <div class="task-item" onclick="window.location.href='telegram.html'"><div class="circle-wrap"><i class="fab fa-telegram-plane"></i></div><span>Telegram</span></div>
        <div class="task-item"><div class="circle-wrap" style="opacity:0.4;"><i class="fab fa-tiktok"></i></div><span>TikTok</span></div>
    </div>

    <div class="p-grid">
        <div class="stat-card"><span style="font-size:10px;">SOCIALS</span><div id="tProg" style="color:var(--neon); font-weight:800; font-size:18px;">0/1</div></div>
        <div class="stat-card"><span style="font-size:10px;">VIDEOS</span><div id="vProg" style="color:var(--neon); font-weight:800; font-size:18px;">0/1</div></div>
    </div>

    <div style="font-weight:700; margin-bottom:15px;">Recent Transactions</div>
    <div id="txContainer"></div>

    <nav class="bottom-nav">
        <a href="reward.html" class="nav-link" style="color:var(--neon);"><i class="fas fa-home"></i>Home</a>
        <a href="upgrade.html" class="nav-link upgrade-pill">UPGRADE</a>
        <a href="profile.html" class="nav-link"><i class="fas fa-user-circle"></i>Profile</a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseClient = supabase.createClient('https://gbmpenlojubfkvqeyxkh.supabase.co', 'sb_publishable_rYaNpJ5Ngw35pxv4TFmXQw_6-LrYGo-');
        
        async function loadData() {
            // Check if user is logged in
            const { data: { user } } = await supabaseClient.auth.getUser();
            if(!user) { 
                window.location.href='index.html'; 
                return; 
            }
            
            // Set basic UI using only Auth data (No Table required)
            document.getElementById('userName').innerText = user.email.split('@')[0].toUpperCase();
            document.getElementById('userInit').innerText = user.email.charAt(0).toUpperCase();
            
            // Balance shows 0 because table is deleted
            document.getElementById('balTxt').innerText = "₦0.00";
            document.getElementById('tProg').innerText = "0/1";
            document.getElementById('vProg').innerText = "0/1";
            
            const container = document.getElementById('txContainer');
            container.innerHTML = `<p style="color:#555; font-size:12px; text-align:center;">No transactions found.</p>`;
        }

        function toggleCur() { 
            alert("Balance data is currently unavailable."); 
        }

        window.onload = loadData;
    </script>
</body>
</html>
