<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celeste Dashboard | Rewards</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --neon: #00ff55; --bg: #000000; --card: #0a0a0a; --text: #ffffff; --soft-text: #888888; --danger: #ff4444; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 15px; padding-bottom: 120px; overflow-x: hidden; }

        /* UPGRADE MODAL */
        #upgradeModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 5000; padding: 20px; }
        .modal-box { background: #0d0d0d; border: 1px solid var(--neon); padding: 30px 20px; border-radius: 25px; width: 100%; max-width: 350px; text-align: center; }
        .m-btn-up { background: var(--neon); color: #000; border: none; width: 100%; padding: 15px; border-radius: 12px; font-weight: 800; cursor: pointer; text-decoration: none; display: block; margin-bottom: 10px; }
        .m-btn-back { background: transparent; color: #fff; border: 1px solid #333; width: 100%; padding: 12px; border-radius: 12px; cursor: pointer; }

        /* SIDEBAR */
        .sidebar { position: fixed; top: 0; left: -260px; width: 260px; height: 100%; background: var(--card); border-right: 1px solid var(--neon); transition: 0.4s ease; z-index: 3000; padding: 30px 20px; }
        .sidebar.active { left: 0; }
        .sidebar a { display: block; color: white; padding: 15px 0; text-decoration: none; border-bottom: 1px solid #111; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; z-index: 2500; }
        .overlay.active { display: block; }

        /* HEADER */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .menu-btn { font-size: 24px; color: var(--neon); cursor: pointer; }
        .initials { width: 35px; height: 35px; background: var(--neon); color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; }

        /* BALANCE */
        .balance-box { background: linear-gradient(145deg, #001a08, #000000); padding: 25px; border-radius: 24px; border: 1px solid rgba(0, 255, 85, 0.2); position: relative; }
        .balance-box h1 { color: var(--neon); margin: 5px 0 15px 0; font-size: 34px; font-weight: 800; }
        .switch-btn { background: rgba(0,255,85,0.1); border: 1px solid var(--neon); color: var(--neon); padding: 8px 15px; border-radius: 50px; font-size: 11px; cursor: pointer; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; }

        /* TASK & PERFORMANCE */
        .section-title { font-weight: 700; font-size: 17px; margin: 25px 0 15px; }
        .task-row { display: flex; overflow-x: auto; gap: 20px; padding-bottom: 10px; scrollbar-width: none; }
        .task-item { text-align: center; flex: 0 0 auto; width: 85px; cursor: pointer; }
        .circle-wrap { width: 68px; height: 68px; border-radius: 50%; border: 1px solid var(--neon); display: flex; align-items: center; justify-content: center; margin-bottom: 8px; background: rgba(0,255,85,0.03); }
        .p-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .stat-card { background: #0f0f0f; border: 1px solid #222; padding: 15px; border-radius: 18px; text-align: center; }

        /* TRANSACTIONS */
        .tx-card { background: #0f0f0f; border: 1px solid #222; padding: 15px; border-radius: 20px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .tx-icon { width: 45px; height: 45px; border-radius: 12px; background: rgba(0,255,85,0.1); display: flex; align-items: center; justify-content: center; color: var(--neon); }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #050505; display: flex; justify-content: space-around; padding: 15px; border-top: 1px solid #1a1a1a; }
        .nav-link { color: #555; text-decoration: none; font-size: 11px; text-align: center; }
        .upgrade-pill { background: var(--neon); color: #000 !important; padding: 10px 18px; border-radius: 8px; font-weight: 800; }
    </style>
</head>
<body>

    <div id="upgradeModal">
        <div class="modal-box">
            <i class="fas fa-lock" style="font-size: 40px; color: var(--neon); margin-bottom: 15px;"></i>
            <h2>Premium Task</h2>
            <p style="color: #888; margin-bottom: 20px;">Upgrade to unlock Premium tasks!</p>
            <a href="upgrade.html" class="m-btn-up">Upgrade Now</a>
            <button class="m-btn-back" onclick="closeModal()">Close</button>
        </div>
    </div>

    <div class="overlay" id="overlay" onclick="closeAll()"></div>
    <div class="sidebar" id="sidebar">
        <h2>CELESTE MENU</h2>
        <a href="profile.html">Profile</a>
        <a href="withdraw.html">Withdrawal</a>
        <a href="index.html" style="color:var(--danger);">Logout</a>
    </div>

    <div class="header">
        <i class="fas fa-bars menu-btn" onclick="openSidebar()"></i>
        <div style="display:flex; align-items:center; gap:10px;">
            <span id="userName">Investor</span>
            <div class="initials" id="userInit">I</div>
        </div>
    </div>

    <div class="balance-box">
        <p style="font-size: 10px; color: var(--soft-text);">AVAILABLE BALANCE</p>
        <h1 id="balTxt">₦14,000.00</h1>
        <div class="switch-btn" onclick="toggleCur()"><span id="curLabel">NAIRA</span> <i class="fas fa-sync-alt"></i></div>
    </div>

    <div class="section-title">Earning Tasks</div>
    <div class="task-row">
        <div class="task-item" onclick="window.location.href='watch.html'"><div class="circle-wrap"><i class="fas fa-play"></i></div><span>Ads</span></div>
        <div class="task-item" onclick="window.location.href='telegram.html'"><div class="circle-wrap"><i class="fab fa-telegram-plane"></i></div><span>Telegram</span></div>
        <div class="task-item" onclick="showPop()"><div class="circle-wrap" style="opacity:0.4;"><i class="fab fa-tiktok"></i></div><span>TikTok</span></div>
    </div>

    <div class="section-title">Performance</div>
    <div class="p-grid">
        <div class="stat-card"><span style="font-size:10px; color:#888;">ADS</span><div id="vProg" style="color:var(--neon); font-weight:800; font-size:18px;">0/1</div></div>
        <div class="stat-card"><span style="font-size:10px; color:#888;">SOCIAL</span><div id="tProg" style="color:var(--neon); font-weight:800; font-size:18px;">0/2</div></div>
    </div>

    <div class="section-title">Recent Transactions</div>
    <div id="txContainer"></div>

    <nav class="bottom-nav">
        <a href="reward.html" class="nav-link" style="color:var(--neon);"><i class="fas fa-home"></i>Home</a>
        <a href="upgrade.html" class="nav-link upgrade-pill">UPGRADE</a>
        <a href="profile.html" class="nav-link"><i class="fas fa-user-circle"></i>Profile</a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://hwensxsqikohnsxwdxji.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_S3ryEPuq04Bw8yJ3_LzmxA_qyVKpJPf';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentBalance = 0;
        let isNaira = true;
        let profileData = null;

        async function loadData() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if(!user) { window.location.href='index.html'; return; }
            
            let { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', user.id).single();
            
            if(!profile) {
                const { data: newP } = await supabaseClient.from('profiles').insert([{ id: user.id, balance: 14000 }]).select().single();
                profile = newP;
            }
            
            profileData = profile;
            currentBalance = profile.balance;
            
            // Set Stats
            document.getElementById('vProg').innerText = (profile.v_done ? "1/1" : "0/1");
            let tCount = (profile.t1_done ? 1 : 0) + (profile.t2_done ? 1 : 0);
            document.getElementById('tProg').innerText = tCount + "/2";

            document.getElementById('userName').innerText = user.email.split('@')[0].toUpperCase();
            document.getElementById('userInit').innerText = user.email.charAt(0).toUpperCase();
            
            updateDisplay();
        }

        function updateDisplay() {
            const bTxt = document.getElementById('balTxt');
            const label = document.getElementById('curLabel');
            
            // MATH: 2000 Naira = 1 Euro
            if(isNaira) {
                bTxt.innerText = "₦" + currentBalance.toLocaleString(undefined, {minimumFractionDigits: 2});
                label.innerText = "NAIRA";
            } else {
                bTxt.innerText = "€" + (currentBalance / 2000).toLocaleString(undefined, {minimumFractionDigits: 2});
                label.innerText = "EURO";
            }

            renderHistory();
        }

        function toggleCur() {
            isNaira = !isNaira;
            updateDisplay();
        }

        function renderHistory() {
            const container = document.getElementById('txContainer');
            container.innerHTML = "";
            
            // 1. Welcome Bonus (14000)
            addTx(container, "Registration Bonus", "Welcome bonus from Celeste", 14000, "fa-gift");
            
            // 2. Video Ads (3000 Naira = €1.50)
            if(profileData.v_done) {
                addTx(container, "Video Reward", "Ad watch revenue", 3000, "fa-play-circle");
            }
            
            // 3. Telegram Task 1 (2000 Naira = €1.00)
            if(profileData.t1_done) {
                addTx(container, "Telegram Task 1", "Community engagement", 2000, "fa-paper-plane");
            }

            // 4. Telegram Task 2 (2000 Naira = €1.00)
            if(profileData.t2_done) {
                addTx(container, "Telegram Task 2", "Channel subscription", 2000, "fa-check-double");
            }
        }

        function addTx(container, title, desc, amt, icon) {
            const card = document.createElement('div');
            card.className = "tx-card";
            const val = isNaira ? "₦" + amt.toLocaleString() : "€" + (amt / 2000).toFixed(2);
            
            card.innerHTML = `
                <div style="display:flex;align-items:center;gap:12px;">
                    <div class="tx-icon"><i class="fas ${icon}"></i></div>
                    <div><span style="font-size:13px;font-weight:700;">${title}</span><br><span style="font-size:10px;color:var(--soft-text);">${desc}</span></div>
                </div>
                <div style="color:var(--neon);font-size:13px;font-weight:800;">+${val}</div>
            `;
            container.prepend(card);
        }

        function showPop() { document.getElementById('upgradeModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('upgradeModal').style.display = 'none'; }
        function openSidebar() { document.getElementById('sidebar').classList.add('active'); document.getElementById('overlay').classList.add('active'); }
        function closeAll() { document.getElementById('sidebar').classList.remove('active'); document.getElementById('overlay').classList.remove('active'); closeModal(); }

        window.onload = loadData;
    </script>
</body>
</html>
