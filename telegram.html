<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Task | Celeste</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --neon: #00ff55; --tg-blue: #0088cc; --bg: #000000; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        
        .tg-box { 
            width: 100%; 
            max-width: 400px; 
            padding: 30px 20px; 
            border: 1px solid rgba(0, 136, 204, 0.3); 
            border-radius: 30px; 
            background: linear-gradient(180deg, #050505 0%, #0a0a0a 100%); 
            text-align: center; 
            margin-bottom: 25px; 
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .reward-badge {
            background: rgba(0, 255, 85, 0.1);
            border: 1px solid var(--neon);
            color: var(--neon);
            padding: 6px 15px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 800;
            display: inline-block;
            margin-bottom: 20px;
        }

        .tg-icon-circle {
            width: 90px;
            height: 90px;
            background: rgba(0, 136, 204, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            border: 1px solid var(--tg-blue);
        }

        .tg-icon { font-size: 45px; color: var(--tg-blue); }

        h2 { font-size: 22px; font-weight: 800; margin-bottom: 10px; }
        p.desc { color: #888; font-size: 14px; line-height: 1.5; margin-bottom: 20px; }

        .steps-box {
            background: rgba(255,255,255,0.03);
            border-radius: 15px;
            padding: 15px;
            text-align: left;
            margin-bottom: 20px;
        }

        .step-item { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; font-size: 13px; color: #bbb; }
        .step-item i { color: var(--tg-blue); width: 15px; }
        .step-item.active { color: #fff; font-weight: 600; }

        button { 
            border: none; 
            padding: 18px; 
            border-radius: 16px; 
            font-weight: 800; 
            cursor: pointer; 
            width: 100%; 
            max-width: 400px; 
            text-transform: uppercase; 
            transition: all 0.3s ease;
            font-size: 14px;
            letter-spacing: 1px;
        }

        #joinBtn { background: var(--tg-blue); color: #fff; box-shadow: 0 4px 15px rgba(0, 136, 204, 0.3); }
        #verifyBtn { background: #fff; color: #000; }
        #claimBtn { background: var(--neon); color: #000; box-shadow: 0 4px 15px rgba(0, 255, 85, 0.3); }
        
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .hidden { display: none; }

        .status-text { font-size: 11px; color: #555; text-transform: uppercase; font-weight: 700; letter-spacing: 1px; margin-top: 10px; }

        .loader { border: 2px solid rgba(0,0,0,0.1); border-top: 2px solid currentColor; border-radius: 50%; width: 16px; height: 16px; animation: spin 0.8s linear infinite; display: inline-block; margin-right: 10px; vertical-align: middle; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="tg-box">
        <div class="reward-badge">EARN €1.0 (₦2,000)</div>
        
        <div class="tg-icon-circle">
            <i class="fab fa-telegram-plane tg-icon"></i>
        </div>

        <h2 id="taskTitle">Join Community</h2>
        <p class="desc" id="taskDesc">Be part of the Celeste official ecosystem to stay updated and unlock your daily reward.</p>

        <div class="steps-box" id="stepsBox">
            <div class="step-item active" id="step1"><i class="fas fa-circle-dot"></i> 1. Join Telegram Channel</div>
            <div class="step-item" id="step2"><i class="fas fa-circle-dot"></i> 2. Return & Verify Join</div>
            <div class="step-item" id="step3"><i class="fas fa-circle-dot"></i> 3. Claim Reward</div>
        </div>

        <div class="status-text" id="counter">Status: Ready to Start</div>
    </div>

    <div id="btnArea" style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px;">
        <button id="joinBtn" onclick="https://t.me/celesteofficial1()">Join Channel Now</button>
        <button id="verifyBtn" class="hidden" onclick="startVerification()">Verify Membership</button>
        <button id="claimBtn" class="hidden" onclick="claimReward()">Claim Your Reward</button>
        
        <button style="background: transparent; color: #555; border: 1px solid #222; padding: 12px; border-radius: 16px;" onclick="window.location.href='reward.html'">Cancel</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://hwensxsqikohnsxwdxji.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_S3ryEPuq04Bw8yJ3_LzmxA_qyVKpJPf';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let userProfile = null;
        let currentLink = "";
        const DAY1_LINK = "https://t.me/celesteofficial1";
        const DAY2_LINK = "https://t.me/Animehub004";

        async function init() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if(!user) { window.location.href='index.html'; return; }

            const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', user.id).single();
            userProfile = profile;

            checkTaskAvailability();
        }

        function checkTaskAvailability() {
            const lastClaimDate = localStorage.getItem('last_tg_claim');
            const today = new Date().toDateString();

            if (userProfile.t1_done && userProfile.t2_done) {
                lockTask("Tasks Completed", "You have finished all free tasks.");
                return;
            }

            if (lastClaimDate === today) {
                lockTask("Daily Limit", "Your next task resets tomorrow.");
                return;
            }

            if (!userProfile.t1_done) {
                currentLink = DAY1_LINK;
            } else {
                currentLink = DAY2_LINK;
                document.getElementById('taskTitle').innerText = "Day 2 Engagement";
            }
        }

        function lockTask(title, desc) {
            document.getElementById('taskTitle').innerText = title;
            document.getElementById('taskDesc').innerText = desc;
            document.getElementById('joinBtn').classList.add('hidden');
            document.getElementById('stepsBox').style.opacity = "0.3";
            document.getElementById('counter').innerText = "RESTRICTED";
        }

        function openTelegram() {
            window.open(currentLink, '_blank');
            document.getElementById('joinBtn').classList.add('hidden');
            document.getElementById('verifyBtn').classList.remove('hidden');
            document.getElementById('step1').style.color = "var(--neon)";
            document.getElementById('step1').innerHTML = `<i class="fas fa-check-circle"></i> 1. Joined Channel`;
            document.getElementById('step2').classList.add('active');
            document.getElementById('counter').innerText = "Status: Waiting for verification";
        }

        function startVerification() {
            const btn = document.getElementById('verifyBtn');
            btn.innerHTML = `<div class="loader"></div> Validating Account...`;
            btn.disabled = true;

            setTimeout(() => {
                btn.classList.add('hidden');
                document.getElementById('claimBtn').classList.remove('hidden');
                document.getElementById('step2').style.color = "var(--neon)";
                document.getElementById('step2').innerHTML = `<i class="fas fa-check-circle"></i> 2. Join Verified`;
                document.getElementById('step3').classList.add('active');
                document.getElementById('counter').innerText = "Status: Verification Success ✅";
            }, 4500);
        }

        async function claimReward() {
            const btn = document.getElementById('claimBtn');
            btn.innerHTML = `<div class="loader"></div> Finalizing...`;
            btn.disabled = true;

            const isDay1 = !userProfile.t1_done;
            const updateField = isDay1 ? { t1_done: true } : { t2_done: true };
            const rewardAmount = 2000;
            const newBalance = (Number(userProfile.balance) || 0) + rewardAmount;

            try {
                // 1. Update the User Balance and Task Status
                const { error: balanceError } = await supabaseClient
                    .from('profiles')
                    .update({ balance: newBalance, ...updateField })
                    .eq('id', userProfile.id);

                if (balanceError) throw balanceError;

                // 2. Add to Transaction History (Update table name 'history' if needed)
                const { error: historyError } = await supabaseClient
                    .from('history') // Ensure your table is named 'history' or 'transactions'
                    .insert([{
                        user_id: userProfile.id,
                        title: isDay1 ? "Telegram Task 1" : "Telegram Task 2",
                        description: "Channel engagement reward",
                        amount: rewardAmount,
                        type: "credit",
                        created_at: new Date().toISOString()
                    }]);

                // Note: If history fails, we still continue since balance was updated
                
                localStorage.setItem('last_tg_claim', new Date().toDateString());
                window.location.href = 'reward.html';

            } catch (err) {
                console.error(err);
                btn.innerHTML = "Claim Your Reward";
                btn.disabled = false;
                alert("Processing failed. Please check your internet.");
            }
        }

        window.onload = init;
    </script>
</body>
</html>
