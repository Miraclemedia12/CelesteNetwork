<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Tasks | Celeste</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --neon: #00ff55; --tg-blue: #0088cc; --bg: #000000; --card: #0d0d0d; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; margin: 0; padding: 20px; text-align: center; }
        .card { background: var(--card); border: 1px solid #222; border-radius: 20px; padding: 20px; margin-bottom: 20px; position: relative; }
        .reward { position: absolute; top: 0; right: 0; background: var(--neon); color: #000; padding: 5px 10px; border-radius: 0 20px 0 20px; font-weight: bold; font-size: 12px; }
        .btn { display: block; width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: bold; text-transform: uppercase; cursor: pointer; text-decoration: none; margin-top: 10px; }
        .btn-join { background: var(--tg-blue); color: #fff; }
        .btn-claim { background: var(--neon); color: #000; }
        .btn-locked { background: #333; color: #777; cursor: not-allowed; }
        .hidden { display: none; }
        .loader { border: 2px solid #fff; border-top: 2px solid transparent; border-radius: 50%; width: 15px; height: 15px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <h2>Telegram Tasks</h2>
    <p style="color: #888;">Complete one task every 24 hours.</p>

    <div class="card" id="card1">
        <div class="reward">₦2,000</div>
        <h3>Official Channel</h3>
        <a href="https://t.me/celesteofficial1" target="_blank" id="btn1" class="btn btn-join" onclick="startClaim(1)">Join Channel</a>
        <button id="claim1" class="btn btn-claim hidden" onclick="finalize(1)">Claim ₦2,000</button>
    </div>

    <div class="card" id="card2">
        <div class="reward">₦2,000</div>
        <h3>Community Hub</h3>
        <a href="https://t.me/Animehub004" target="_blank" id="btn2" class="btn btn-join" onclick="startClaim(2)">Join Community</a>
        <button id="claim2" class="btn btn-claim hidden" onclick="finalize(2)">Claim ₦2,000</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://hwensxsqikohnsxwdxji.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_S3ryEPuq04Bw8yJ3_LzmxA_qyVKpJPf';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let profile = null;

        async function init() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if(!user) return;
            const { data } = await supabaseClient.from('profiles').select('*').eq('id', user.id).single();
            profile = data;

            const lastClaim = localStorage.getItem('last_tg_date');
            const today = new Date().toDateString();

            // Handle Task 1 locking
            if (profile.t1_done) {
                document.getElementById('btn1').innerText = "DONE ✅";
                document.getElementById('btn1').classList.add('btn-locked');
                document.getElementById('btn1').removeAttribute('href');
            }

            // Handle Task 2 locking (Locked if T1 not done OR if already claimed something today)
            if (profile.t2_done) {
                document.getElementById('btn2').innerText = "DONE ✅";
                document.getElementById('btn2').classList.add('btn-locked');
                document.getElementById('btn2').removeAttribute('href');
            } else if (!profile.t1_done || lastClaim === today) {
                document.getElementById('btn2').innerText = "LOCKED 🔒";
                document.getElementById('btn2').classList.add('btn-locked');
                document.getElementById('btn2').removeAttribute('href');
            }
        }

        function startClaim(num) {
            setTimeout(() => {
                document.getElementById(`btn${num}`).classList.add('hidden');
                document.getElementById(`claim${num}`).classList.remove('hidden');
            }, 3000); // 3 second delay to let them join
        }

        async function finalize(num) {
            const btn = document.getElementById(`claim${num}`);
            btn.innerHTML = `<div class="loader"></div> Syncing...`;
            btn.disabled = true;

            const newBalance = (Number(profile.balance) || 0) + 2000;
            const update = num === 1 ? { t1_done: true, balance: newBalance } : { t2_done: true, balance: newBalance };

            const { error } = await supabaseClient.from('profiles').update(update).eq('id', profile.id);

            if (!error) {
                localStorage.setItem('last_tg_date', new Date().toDateString());
                window.location.href = 'reward.html';
            } else {
                alert("Error! Try again.");
                btn.innerText = "Claim ₦2,000";
                btn.disabled = false;
            }
        }
        window.onload = init;
    </script>
</body>
</html>
